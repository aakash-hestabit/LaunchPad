services:
  frontend:
    build:
      context: ./client
    container_name: react-client
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build:
      context: ./server
    container_name: node-server
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/test
    networks:
      - app-net
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: mongodb
    networks:
      - app-net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  mongo-data:
