
services:
  backend:
    build:
      context: ./backend
    container_name: day4_backend
    expose:
      - "5000"

    restart: unless-stopped

  nginx:
    build: ./nginx
    image: nginx:alpine
    container_name: day4_nginx
    ports:
      - "81:80"      
      - "443:443"  
    depends_on:
      - backend

    restart: unless-stopped