events {
}

http {

    upstream backend_up {
        server backend:5000;   
    }

    server {
        listen 80;
        server_name new.domain;

        return 301 https://$host$request_uri;
        
    }

    server {
        listen 443 ssl;
        server_name new.domain;

        ssl_certificate      /etc/nginx/certs/new.domain.pem;
        ssl_certificate_key  /etc/nginx/certs/new.domain-key.pem;

        location / {
            proxy_pass http://backend_up;
        }
    }
}
