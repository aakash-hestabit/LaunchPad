services:
  frontend:
    build:
      context: ./client
    container_name: react-client-day3
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - app-net
    restart: unless-stopped

  backend1:
    build:
      context: ./server
    container_name: node-server-1
    expose:
      - "5000"
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/test
    networks:
      - app-net
    restart: unless-stopped

  backend2:
    build:
      context: ./server
    container_name: node-server-2
    expose:
      - "5000"
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/test
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      -  "5000:5000"
    networks:
      - app-net
    depends_on:
      - backend1
      - backend2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped



  mongo:
    image: mongo:6
    container_name: mongodb
    networks:
      - app-net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

networks:
  app-net:
    driver: bridge

volumes:
  mongo-data:
